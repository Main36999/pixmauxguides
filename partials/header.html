    <header class="site-header">
      <div class="wrap header-inner">
        <a href="../index.html" class="brand" aria-label="PIXMA UX Guides home">
          <img
            class="brand-mark"
            src="/assets/logo.png"
            width="32"
            height="32"
            alt=""
            aria-hidden="true"
          />
          <span class="brand-text"><strong>PIXMA</strong></span>
        </a>
        <div class="header-actions">
          <nav class="site-nav" aria-label="Primary">
            <a href="../index.html#guides">All Guides</a>
            <a href="../index.html#toolbar">Categories</a>
          </nav>
          <form
            class="header-search"
            role="search"
            action="../index.html"
            method="get"
          >
            <label for="header-search-input" class="sr-only"
              >Search guides</label
            >
            <input
              type="search"
              id="header-search-input"
              name="q"
              placeholder="Search guides…"
              autocomplete="off"
            />
            <button
              type="submit"
              class="header-search__submit"
              aria-label="Search guides"
            >
              <svg
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="1.8"
                stroke-linecap="round"
                stroke-linejoin="round"
                aria-hidden="true"
                focusable="false"
              >
                <circle cx="11" cy="11" r="7" />
                <line x1="21" y1="21" x2="16.2" y2="16.2" />
              </svg>
            </button>
          </form>
        </div>
        <button
          type="button"
          class="menu-toggle"
          id="menu-toggle"
          aria-expanded="false"
          aria-controls="mobile-menu"
          aria-label="Open menu"
        >
          <svg
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="1.8"
            stroke-linecap="round"
            stroke-linejoin="round"
            aria-hidden="true"
            focusable="false"
          >
            <line x1="4" y1="7" x2="20" y2="7" />
            <line x1="4" y1="12" x2="20" y2="12" />
            <line x1="4" y1="17" x2="20" y2="17" />
          </svg>
        </button>
      </div>
      <div class="mobile-menu" id="mobile-menu" hidden>
        <nav class="mobile-menu__nav" aria-label="Primary">
          <a href="../index.html#guides">All Guides</a>
          <a href="../index.html#toolbar">Categories</a>
        </nav>
        <form
          class="header-search mobile-menu__search"
          role="search"
          action="../index.html"
          method="get"
        >
          <label for="mobile-search-input" class="sr-only">Search guides</label>
          <input
            type="search"
            id="mobile-search-input"
            name="q"
            placeholder="Search guides…"
            autocomplete="off"
          />
          <button
            type="submit"
            class="header-search__submit"
            aria-label="Search guides"
          >
            <svg
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="1.8"
              stroke-linecap="round"
              stroke-linejoin="round"
              aria-hidden="true"
              focusable="false"
            >
              <circle cx="11" cy="11" r="7" />
              <line x1="21" y1="21" x2="16.2" y2="16.2" />
            </svg>
          </button>
        </form>
      </div>
    </header>
