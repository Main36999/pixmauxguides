<header class="site-header site-header--inner">
  <div class="header-top">
    <a href="../index.html" class="brand" aria-label="bpozz! home">
      <img class="brand-logo" src="/assets/bpozz-logo.svg" alt="" width="88" height="32" />
    </a>

    <form
      class="header-search header-search--full form"
      role="search"
      action="/search"
      method="get"
    >
      <label for="header-search-input" class="sr-only">Search BPOZZ</label>
      <button type="submit" aria-label="Search BPOZZ">
        <svg
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="1.8"
          stroke-linecap="round"
          stroke-linejoin="round"
          aria-hidden="true"
          focusable="false"
        >
          <circle cx="11" cy="11" r="7" />
          <line x1="21" y1="21" x2="16.2" y2="16.2" />
        </svg>
      </button>
      <input
        type="search"
        id="header-search-input"
        name="s"
        placeholder="Search guides, palettes…"
        autocomplete="off"
        class="input"
      />
      <button type="reset" class="reset" aria-label="Clear search">
        <svg
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="1.8"
          stroke-linecap="round"
          stroke-linejoin="round"
          aria-hidden="true"
          focusable="false"
        >
          <line x1="5" y1="5" x2="19" y2="19" />
          <line x1="19" y1="5" x2="5" y2="19" />
        </svg>
      </button>
    </form>

    <button
      type="button"
      class="menu-toggle"
      id="menu-toggle"
      aria-expanded="false"
      aria-controls="mobile-menu"
      aria-label="Open menu"
    >
      <svg
        class="menu-toggle__icon menu-toggle__icon--open"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="1.8"
        stroke-linecap="round"
        stroke-linejoin="round"
        aria-hidden="true"
        focusable="false"
      >
        <line x1="4" y1="7" x2="20" y2="7" />
        <line x1="4" y1="12" x2="20" y2="12" />
        <line x1="4" y1="17" x2="20" y2="17" />
      </svg>
      <svg
        class="menu-toggle__icon menu-toggle__icon--close"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="1.8"
        stroke-linecap="round"
        stroke-linejoin="round"
        aria-hidden="true"
        focusable="false"
      >
        <line x1="5" y1="5" x2="19" y2="19" />
        <line x1="19" y1="5" x2="5" y2="19" />
      </svg>
    </button>
  </div>

  <div class="header-bottom">
    <nav class="site-nav" aria-label="Primary">
      <!--NAV_RESOURCES_START-->
      <a href="/colors/">Colors</a>
      <a href="/palettes/">Color Palettes</a>
      <a href="/guides/">UI/UX Guides</a>
      <a href="/image-picker/">Image Picker</a>
      <!--NAV_RESOURCES_END-->
    </nav>
  </div>

  <div class="mobile-menu" id="mobile-menu" hidden>
    <nav class="mobile-menu__nav" aria-label="Primary">
      <!--NAV_RESOURCES_START-->
      <a href="/colors/">Colors</a>
      <a href="/palettes/">Color Palettes</a>
      <a href="/guides/">UI/UX Guides</a>
      <a href="/image-picker/">Image Picker</a>
      <!--NAV_RESOURCES_END-->
      <a href="/search">Explore</a>
    </nav>
  </div>
</header>
