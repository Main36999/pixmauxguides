<!doctype html>
<html lang="en">
  <head>
    <script
      id="Cookiebot"
      src="https://consent.cookiebot.com/uc.js"
      data-cbid="585f3600-2a77-4ba9-87f7-9aac44c21247"
      data-blockingmode="auto"
      type="text/javascript"
    ></script>

    <!-- Google Consent Mode v2 — default state, set before gtag.js loads.
         data-cookieconsent="ignore" exempts this script from Cookiebot's
         auto-blocking so the default always fires immediately; Cookiebot
         then pushes gtag('consent','update', …) automatically once the
         visitor makes a choice in the banner. -->
    <script data-cookieconsent="ignore">
      window.dataLayer = window.dataLayer || [];
      function gtag() {
        dataLayer.push(arguments);
      }
      gtag("consent", "default", {
        ad_storage: "denied",
        analytics_storage: "denied",
        ad_user_data: "denied",
        ad_personalization: "denied",
        functionality_storage: "denied",
        personalization_storage: "denied",
        security_storage: "granted",
        wait_for_update: 500,
      });
      gtag("set", "ads_data_redaction", true);
      gtag("set", "url_passthrough", false);
    </script>
    <meta charset="UTF-8" />
    <!-- 404 page. Netlify serves this file, with status 404, at whatever
         missing URL was requested, so relative links here (and the ones the
         header and footer builders write for a root page) would resolve
         against that URL. <base href="/"> resolves them from the site root.
         For the same reason the page has no "#main" skip link: under <base>
         it would point at /#main. noindex, and no canonical, Open Graph or
         JSON-LD: an error page is not content. -->
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Page not found — bpozz</title>
    <meta
      name="description"
      content="The page you were looking for could not be found on bpozz."
    />
    <meta name="robots" content="noindex" />

    <!-- Google tag (gtag.js) -->
    <script
      async
      src="https://www.googletagmanager.com/gtag/js?id=G-NHGHCTY21D"
    ></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag() {
        dataLayer.push(arguments);
      }
      gtag("js", new Date());

      gtag("config", "G-NHGHCTY21D");
    </script>

    <meta name="theme-color" content="#101010" />
    <link rel="icon" type="image/png" href="/assets/favicon.png" />
    <link rel="apple-touch-icon" href="/assets/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,100..1000;1,9..40,100..1000&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <!-- A standalone page: the site header and footer stay out (the build
         leaves both marker regions empty for 404.html; STANDALONE_PAGES in
         src/build/header.js). Its own top row instead: the wordmark home
         and a way to get in touch. -->
    <!--HEADER_START--><!--HEADER_END-->
    <header class="notfound-top">
      <a href="/" class="notfound-top__brand" aria-label="bpozz home" translate="no">bpozz</a>
      <a href="/contact" class="notfound-top__contact">Contact Us</a>
    </header>

    <main class="notfound" id="main" tabindex="-1">
      <div class="notfound__copy">
        <p class="notfound__code">404</p>
        <h1 class="notfound__title">Page not found</h1>
      </div>
    </main>
    <!--FOOTER_START--><!--FOOTER_END-->

    <script src="/error-beacon.js"></script>
    <script src="/auth.js"></script>
  </body>
</html>
