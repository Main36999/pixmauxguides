    <!-- Google Consent Mode v2 — default state, set before gtag.js loads.
         data-cookieconsent="ignore" exempts this script from Cookiebot's
         auto-blocking so the default always fires immediately; Cookiebot
         then pushes gtag('consent','update', …) automatically once the
         visitor makes a choice in the banner. -->
    <script data-cookieconsent="ignore">
      window.dataLayer = window.dataLayer || [];
      function gtag() {
        dataLayer.push(arguments);
      }
      gtag("consent", "default", {
        ad_storage: "denied",
        analytics_storage: "denied",
        ad_user_data: "denied",
        ad_personalization: "denied",
        functionality_storage: "denied",
        personalization_storage: "denied",
        security_storage: "granted",
        wait_for_update: 500,
      });
      gtag("set", "ads_data_redaction", true);
      gtag("set", "url_passthrough", false);
    </script>
    <meta charset="UTF-8" />
    <!-- 404 page. Netlify serves this file, with status 404, at whatever
         missing URL was requested, so relative links here (and the ones the
         header and footer builders write for a root page) would resolve
         against that URL. <base href="/"> resolves them from the site root.
         For the same reason the page has no "#main" skip link: under <base>
         it would point at /#main. noindex, and no canonical, Open Graph or
         JSON-LD: an error page is not content. -->
    <base href="/" />

    <!-- Mobile menu toggle (kept in sync with app.js's "Mobile menu toggle" block —
         this page loads no other script, so the wiring lives here too). -->
    <script>
      (function () {
        var toggle = document.getElementById("menu-toggle");
        var menu = document.getElementById("mobile-menu");
        if (!toggle || !menu) return;

        function closeMenu() {
          menu.hidden = true;
          toggle.setAttribute("aria-expanded", "false");
          toggle.setAttribute("aria-label", "Open menu");
        }

        function openMenu() {
          menu.hidden = false;
          toggle.setAttribute("aria-expanded", "true");
          toggle.setAttribute("aria-label", "Close menu");
        }

        toggle.addEventListener("click", function () {
          if (menu.hidden) {
            openMenu();
          } else {
            closeMenu();
          }
        });

        menu.querySelectorAll("a").forEach(function (link) {
          link.addEventListener("click", closeMenu);
        });

        document.addEventListener("keydown", function (e) {
          if (e.key === "Escape" && !menu.hidden) {
            closeMenu();
            toggle.focus();
          }
        });
      })();
    </script>
